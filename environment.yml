# Matches the working Python/PyTorch/CUDA versions on Windows.
# Requires an NVIDIA GPU and a driver compatible with CUDA 11.8.
# Run from the repository root: conda env create -f environment.yml
name: misl
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10.16
  - pip=25.0
  - setuptools=75.8.0
  - wheel=0.45.1
  - pytorch=2.5.1
  - pytorch-cuda=11.8
  - pip:
      - -r requirements.txt
